# GF Wordbench optional validation-profile template
#
# This profile augments a language that Wordbench resolves directly from an
# existing RGL source tree. It does not own the selected language path, RGL
# root, source inventory, GF executable, output root, or run directory.
#
# The filename `project.toml` is retained for compatibility. New readers should
# treat this document as a validation profile.
#
# All module paths below are relative to the resolved language directory.
# All scenario/input/gold paths are relative to this profile directory.
# Absolute machine-specific paths are forbidden.

schema_id = "gf-wordbench.project"
schema_version = "1.0"

[profile]
id = "<PROFILE_ID>"
name = "<PROFILE_NAME>"

[compatibility]
# Optional guard only. It must match the language key already resolved by
# Wordbench; it cannot select or rename the active language.
expected_language_key = ""

[selection]
# Additional policy applied inside the resolved language directory.
include = []
exclude = []

[modules]
# Modules required for profiled validation.
required_entrypoints = []

# Additional modules required specifically for release.
release_entrypoints = []

# Ordered architectural proof points.
checkpoints = []

[validation]
required_scenarios = []
optional_scenarios = []

[release]
requires_pgf = false
pgf_targets = []
required_artifacts = []
required_gates = []
