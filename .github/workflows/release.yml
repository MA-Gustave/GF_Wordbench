name: GF Wordbench Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable release tag to validate and stage"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  source-policy:
    name: Resolve immutable source and prior evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      short_commit: ${{ steps.metadata.outputs.short_commit }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up release Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate tag, commit, version, and clean checkout
        id: metadata
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="${REQUESTED_TAG}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 2
          fi

          git show-ref --verify --quiet "refs/tags/${tag}" || {
            echo "Release tag does not exist in the checkout: ${tag}" >&2
            exit 1
          }

          commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${commit}" != "${head_commit}" ]]; then
            echo "Checked-out commit ${head_commit} does not match ${tag} (${commit})." >&2
            exit 1
          fi

          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "Release checkout is not clean." >&2
            git status --short >&2
            exit 1
          fi

          version="$(PYTHONPATH=src python -c 'from gf_wordbench.version import __version__; print(__version__)')"
          if [[ "v${version}" != "${tag}" ]]; then
            echo "Tag ${tag} does not match canonical package version ${version}." >&2
            exit 1
          fi

          prerelease=false
          if [[ "${tag}" == *-* ]]; then
            prerelease=true
          fi

          short_commit="${commit:0:12}"
          artifact_name="gf-wordbench-${tag}-${short_commit}-attempt-${GITHUB_RUN_ATTEMPT}"

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "commit=${commit}"
            echo "short_commit=${short_commit}"
            echo "prerelease=${prerelease}"
            echo "artifact_name=${artifact_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Require successful quality, tests, and real-GF evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          set -euo pipefail

          for workflow in quality.yml tests.yml real_gf.yml; do
            payload="$(
              gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs" \
                -f head_sha="${RELEASE_COMMIT}" \
                -f status=success \
                -f per_page=100
            )"
            count="$(
              RELEASE_COMMIT="${RELEASE_COMMIT}" python -c '
          import json
          import os
          import sys

          commit = os.environ["RELEASE_COMMIT"]
          document = json.load(sys.stdin)
          runs = document.get("workflow_runs", [])
          print(sum(run.get("head_sha") == commit and run.get("conclusion") == "success" for run in runs))
          ' <<< "${payload}"
            )"
            if [[ "${count}" -lt 1 ]]; then
              echo "No successful ${workflow} run exists for ${RELEASE_COMMIT}." >&2
              exit 1
            fi
            echo "Verified ${workflow} evidence for ${RELEASE_COMMIT}."
          done

  build-and-verify:
    name: Build and verify exact release artifacts
    needs: source-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out the approved tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.source-policy.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up authoritative build Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install declared development dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pip>=25,<26"
          python -m pip install -e ".[dev]"

      - name: Verify repository architecture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_architecture.py --root . --warnings-as-errors

      - name: Compile Python sources and tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts

      - name: Run static quality gates
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check .
          python -m mypy src/gf_wordbench tests scripts

      - name: Run schema and migration gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_schemas.py --root . --strict --fail-fast
          python -m pytest -m "schema or migration"

      - name: Run release-specific tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/release

      - name: Build wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build dist release-dist
          python -m build --sdist --wheel --outdir release-dist

      - name: Verify package names and create release provenance
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.source-policy.outputs.tag }}
          RELEASE_VERSION: ${{ needs.source-policy.outputs.version }}
          RELEASE_COMMIT: ${{ needs.source-policy.outputs.commit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import platform
          from pathlib import Path
          import subprocess
          import sys

          dist = Path("release-dist")
          version = os.environ["RELEASE_VERSION"]
          normalized = version.replace("-", "_")
          wheels = sorted(dist.glob(f"gf_wordbench-{normalized}-*.whl"))
          sdists = sorted(dist.glob(f"gf_wordbench-{normalized}.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"Expected one wheel and one sdist; found wheels={wheels}, sdists={sdists}"
              )

          freeze = subprocess.run(
              [sys.executable, "-m", "pip", "freeze", "--all"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout
          (dist / "build-environment.txt").write_text(
              "\n".join(
                  (
                      f"tag={os.environ['RELEASE_TAG']}",
                      f"commit={os.environ['RELEASE_COMMIT']}",
                      f"workflow_run_id={os.environ['GITHUB_RUN_ID']}",
                      f"workflow_run_attempt={os.environ['GITHUB_RUN_ATTEMPT']}",
                      f"runner_os={os.environ['RUNNER_OS']}",
                      f"runner_arch={os.environ['RUNNER_ARCH']}",
                      f"python={platform.python_version()}",
                      "build_command=python -m build --sdist --wheel --outdir release-dist",
                      "",
                      freeze.rstrip(),
                      "",
                  )
              ),
              encoding="utf-8",
              newline="\n",
          )

          artifacts: list[dict[str, object]] = []
          for path in sorted(dist.iterdir(), key=lambda item: item.name.casefold()):
              if not path.is_file() or path.name in {"SHA256SUMS", "release-provenance.json"}:
                  continue
              payload = path.read_bytes()
              artifacts.append(
                  {
                      "filename": path.name,
                      "size_bytes": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                  }
              )

          provenance = {
              "schema_id": "gf-wordbench.release-provenance",
              "schema_version": "1.0",
              "tag": os.environ["RELEASE_TAG"],
              "version": version,
              "commit": os.environ["RELEASE_COMMIT"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "runner": {
                  "os": os.environ["RUNNER_OS"],
                  "architecture": os.environ["RUNNER_ARCH"],
                  "python": platform.python_version(),
              },
              "build_command": "python -m build --sdist --wheel --outdir release-dist",
              "artifacts": artifacts,
          }
          (dist / "release-provenance.json").write_text(
              json.dumps(provenance, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          checksum_paths = sorted(
              path
              for path in dist.iterdir()
              if path.is_file() and path.name != "SHA256SUMS"
          )
          lines = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}"
              for path in checksum_paths
          ]
          (dist / "SHA256SUMS").write_text(
              "\n".join(lines) + "\n",
              encoding="ascii",
              newline="\n",
          )
          PY

      - name: Verify checksums
        shell: bash
        working-directory: release-dist
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS

      - name: Clean-install and smoke-test the exact wheel
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.source-policy.outputs.version }}
        run: |
          set -euo pipefail
          python -m venv .release-smoke
          smoke_python=".release-smoke/bin/python"
          smoke_cli=".release-smoke/bin/gf-wordbench"
          wheel="$(find release-dist -maxdepth 1 -type f -name 'gf_wordbench-*.whl' -print -quit)"
          test -n "${wheel}"
          "${smoke_python}" -m pip install --no-deps --no-index "${wheel}"
          "${smoke_cli}" --version | grep -Fx "GF Wordbench ${RELEASE_VERSION}"
          "${smoke_cli}" --help >/dev/null
          "${smoke_cli}" project check --help >/dev/null

      - name: Confirm build did not mutate tracked source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':(exclude)release-dist' ':(exclude)build'

      - name: Upload immutable release candidate bundle
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ needs.source-policy.outputs.artifact_name }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          include-hidden-files: false

  stage-draft-release:
    name: Stage exact artifacts as a draft release
    needs:
      - source-policy
      - build-and-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the approved tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ needs.source-policy.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the exact validated workflow artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build-and-verify.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p staged
          curl --fail-with-body --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output release-bundle.zip
          python -m zipfile -e release-bundle.zip staged

      - name: Verify staged bytes and source identity
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.source-policy.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.source-policy.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "${RELEASE_COMMIT}"
          test -f staged/SHA256SUMS
          (cd staged && sha256sum --check SHA256SUMS)

      - name: Refuse release-asset overwrite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source-policy.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "A GitHub release already exists for ${RELEASE_TAG}; published assets are immutable." >&2
            exit 1
          fi

      - name: Create draft release from exact validated artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source-policy.outputs.tag }}
          RELEASE_VERSION: ${{ needs.source-policy.outputs.version }}
          RELEASE_COMMIT: ${{ needs.source-policy.outputs.commit }}
          PRERELEASE: ${{ needs.source-policy.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            "${RELEASE_TAG}"
            staged/*
            --repo "${GITHUB_REPOSITORY}"
            --verify-tag
            --draft
            --generate-notes
            --title "GF Wordbench ${RELEASE_VERSION}"
            --target "${RELEASE_COMMIT}"
          )
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

  verify-staged-release:
    name: Independently verify staged release download
    needs:
      - source-policy
      - stage-draft-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Set up clean verification Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.9"

      - name: Download draft-release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source-policy.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir downloaded

      - name: Verify downloaded hashes and package smoke test
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.source-policy.outputs.version }}
        run: |
          set -euo pipefail
          (cd downloaded && sha256sum --check SHA256SUMS)
          python -m venv clean-environment
          clean_python="clean-environment/bin/python"
          clean_cli="clean-environment/bin/gf-wordbench"
          wheel="$(find downloaded -maxdepth 1 -type f -name 'gf_wordbench-*.whl' -print -quit)"
          test -n "${wheel}"
          "${clean_python}" -m pip install --no-deps --no-index "${wheel}"
          "${clean_cli}" --version | grep -Fx "GF Wordbench ${RELEASE_VERSION}"
          "${clean_cli}" --help >/dev/null

      - name: Record human-promotion requirement
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.source-policy.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.source-policy.outputs.commit }}
          ARTIFACT_DIGEST: ${{ needs.build-and-verify.outputs.artifact_digest }}
        run: |
          {
            echo "## GF Wordbench staged release verified"
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Commit: \`${RELEASE_COMMIT}\`"
            echo "- Workflow artifact digest: \`${ARTIFACT_DIGEST}\`"
            echo "- Downloaded checksums: verified"
            echo "- Clean wheel installation: verified"
            echo
            echo "The GitHub release remains a draft. Human sign-off is required before promotion."
          } >> "${GITHUB_STEP_SUMMARY}"
