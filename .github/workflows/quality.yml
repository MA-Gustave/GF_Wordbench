name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# This workflow is intentionally independent of a real GF installation.
# Real-GF validation belongs to .github/workflows/real_gf.yml.
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  python-quality:
    name: Python quality and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the exact workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: ""

      - name: Record workflow provenance
        env:
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          TRIGGER: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          {
            echo "## Quality provenance"
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Revision: \`${SOURCE_REVISION}\`"
            echo "- Ref: \`${SOURCE_REF}\`"
            echo "- Trigger: \`${TRIGGER}\`"
            echo "- Attempt: \`${ATTEMPT}\`"
            echo "- Runner OS: \`${RUNNER_OS_NAME}\`"
            echo "- Python: \`$(python --version 2>&1)\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install declared development dependencies
        run: |
          python -m pip install --no-cache-dir -e ".[dev]"
          python -m pip check
          python -m pip freeze --all

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Verify test discovery
        run: python -m pytest --collect-only -q

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type-check
        run: python -m mypy

      - name: Verify canonical architecture
        run: >-
          python scripts/verify_architecture.py
          --root .
          --warnings-as-errors

      - name: Validate interfile and project contracts
        run: >-
          python scripts/validate_contracts.py
          --workspace-root .
          --strict

      - name: Validate persisted schemas
        run: >-
          python scripts/validate_schemas.py
          --root .
          --strict

  unit-tests:
    name: Unit tests without GF
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the exact workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: ""

      - name: Install declared development dependencies
        run: |
          python -m pip install --no-cache-dir -e ".[dev]"
          python -m pip check

      - name: Run unit tests without GF
        run: python -m pytest tests/unit -m "not gf"
